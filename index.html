<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cfe8ff">
  <title>アルゴクエスト</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='%23B388FF' stroke='%23412a80' stroke-width='2'/%3E%3Ctext x='16' y='21' font-size='13' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- タイトル -->
    <section id="screen-title" class="screen" aria-label="タイトル"></section>
    <!-- あいさつ＋遊び方 -->
    <section id="screen-tutorial" class="screen" aria-label="遊び方"></section>
    <!-- ステージ一覧 -->
    <section id="screen-stages" class="screen" aria-label="ワールドマップ"></section>
    <!-- エリア（ジャンル内のステージ一覧） -->
    <section id="screen-area" class="screen" aria-label="エリア"></section>
    <!-- 問題 -->
    <section id="screen-quiz" class="screen" aria-label="問題"></section>
    <!-- 解説 -->
    <section id="screen-explain" class="screen" aria-label="解説"></section>
    <!-- 設定 -->
    <section id="screen-settings" class="screen" aria-label="設定"></section>
  </div>

  <!-- ○×オーバーレイ -->
  <div id="ox-overlay" class="ox-overlay" hidden aria-live="assertive"></div>
  <!-- ダイアログ -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
